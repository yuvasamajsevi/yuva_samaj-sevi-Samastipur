<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अमित सिंह - युवा समाज सेवी संगठन</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="poster-container">
        <!-- शीर्ष हेडर -->
        <div class="header-banner">
            <h2>युवा समाज सेवी संगठन</h2>
            <p class="location">समस्तीपुर, बिहार</p>
            <p class="slogan">“युवा शक्ति, समाज की प्रगति!”</p>
        </div>

        <!-- मुख्य सामग्री क्षेत्र -->
        <div class="main-content">
            <div class="info-card">
                <div class="badge">सेवा • समानता • विकास</div>
                
                <!-- फोटो सेक्शन -->
                <div class="profile-image-container">
                    <!-- यहाँ अपनी फोटो का सही नाम या पाथ डालें -->
                    <img src="amit_singh.jpg" alt="अमित सिंह" class="profile-image">
                </div>
                
                <!-- नाम और सदस्य पद -->
                <h1 class="name">अमित सिंह</h1>
                <p class="designation">सक्रिय सदस्य</p>
                
                <div class="namaste-box">
                    <p>🙏 आप सभी को मेरा सादर प्रणाम 🙏</p>
                </div>
            </div>
        </div>

        <!-- फुटर विवरण -->
        <div class="footer-banner">
            <p>📞 +91 9155090249</p>
            <p>📍 समस्तीपुर, बिहार</p>
        </div>
    </div>

</body>
</html>
